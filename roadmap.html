        const container = document.getElementById('roadmapContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const resetBtn = document.getElementById('resetBtn');

        // Generar un ID único para cada tarea basado en el índice
        function getTaskId(moduleIndex, taskIndex) {
            return `task-${moduleIndex}-${taskIndex}`;
        }

        // Renderizar la lista
        function renderRoadmap() {
            let html = '';
            
            roadmapData.forEach((module, mIndex) => {
                // Generar ID para el módulo (para guardar si está colapsado)
                const moduleId = `module-${mIndex}`;
                const isCollapsed = localStorage.getItem(moduleId) === 'true';
                
                html += `
                    <div class="module">
                        <div class="module-header ${isCollapsed ? 'collapsed' : ''}" data-module-id="${moduleId}">
                            <span>${module.title}</span>
                            <span class="arrow">▼</span>
                        </div>
                        <div class="module-content ${isCollapsed ? 'collapsed' : ''}">
                `;

                module.tasks.forEach((task, tIndex) => {
                    const taskId = getTaskId(mIndex, tIndex);
                    const isCompleted = localStorage.getItem(taskId) === 'true';
                    
                    html += `
                        <div class="task ${isCompleted ? 'completed' : ''}" data-task-id="${taskId}">
                            <input type="checkbox" id="${taskId}" ${isCompleted ? 'checked' : ''}>
                            <label for="${taskId}">
                                <span class="day-tag">${task.day}</span>
                                ${task.text}
                            </label>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            updateProgress();
            attachEventListeners();
        }

        // Actualizar la barra de progreso
        function updateProgress() {
            const totalTasks = document.querySelectorAll('.task').length;
            const completedTasks = document.querySelectorAll('.task.completed').length;
            
            const percentage = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);
            
            progressFill.style.width = `${percentage}%`;
            progressText.textContent = `${percentage}%`;
        }

        // Manejar eventos
        function attachEventListeners() {
            // Checkboxes
            document.querySelectorAll('.task input[type="checkbox"]').forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    const taskDiv = e.target.closest('.task');
                    const taskId = taskDiv.dataset.taskId;
                    
                    if (e.target.checked) {
                        taskDiv.classList.add('completed');
                        localStorage.setItem(taskId, 'true');
                    } else {
                        taskDiv.classList.remove('completed');
                        localStorage.removeItem(taskId);
                    }
                    updateProgress();
                });
            });

            // Colapsar módulos
            document.querySelectorAll('.module-header').forEach(header => {
                header.addEventListener('click', () => {
                    const moduleId = header.dataset.moduleId;
                    const content = header.nextElementSibling;
                    
                    header.classList.toggle('collapsed');
                    content.classList.toggle('collapsed');
                    
                    // Guardar estado en localStorage
                    const isCollapsed = header.classList.contains('collapsed');
                    localStorage.setItem(moduleId, isCollapsed);
                });
            });
        }

        // Reiniciar progreso
        resetBtn.addEventListener('click', () => {
            if (confirm('¿Estás seguro de que quieres borrar todo tu progreso? Esta acción no se puede deshacer.')) {
                localStorage.clear();
                renderRoadmap();
            }
        });

        // Inicializar
        renderRoadmap();

    </script>
